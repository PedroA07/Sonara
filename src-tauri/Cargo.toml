[package]
name = "sonara"
version = "0.1.0"
description = "Sonara desktop music player"
authors = ["Pedro"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
lofty = "0.21"
anyhow = "1"
thiserror = "1"
ureq = "2"

[features]
# by default Tauri runs in production mode; devtools are enabled in debug builds
custom-protocol = ["tauri/custom-protocol"]
