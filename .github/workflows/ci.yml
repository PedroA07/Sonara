name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install JS dependencies
        run: npm install

      - name: Typecheck (frontend)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build frontend
        run: npm run build

      # Tauri's build script validates that every `externalBin` in
      # tauri.conf.json exists (with the host target-triple suffix) before it
      # will compile the crate. CI only compiles the core and runs pure-function
      # unit tests — it never executes the sidecars — so empty stub files are
      # enough to satisfy the check. Real yt-dlp/ffmpeg binaries are provisioned
      # in release.yml for actual bundles.
      - name: Stub sidecar binaries (satisfy Tauri externalBin)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          for bin in yt-dlp ffmpeg; do
            touch "src-tauri/binaries/${bin}-${TRIPLE}${EXT}"
            chmod +x "src-tauri/binaries/${bin}-${TRIPLE}${EXT}" || true
          done
          ls -l src-tauri/binaries

      - name: Cargo test (core)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo build (core)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Guard-rail: sem isto, avisos de dead_code e lints de estilo voltam a se
      # acumular sem ninguém perceber até alguém rodar clippy localmente.
      - name: Cargo clippy (core)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
