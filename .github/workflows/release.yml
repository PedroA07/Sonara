name: Release

# Three ways in, because relying on the tag push alone produced a published
# release with no installers attached:
#
#  - push: the normal path (`git push origin v0.2.0`).
#  - release: a release created by hand in the GitHub UI creates its tag
#    "on publish", and that does not reliably fire the tag push event — the
#    release would otherwise sit there empty. Releases created by this workflow
#    itself never re-trigger it: GitHub does not fire events for actions taken
#    with GITHUB_TOKEN, so there is no loop.
#  - workflow_dispatch: publicar (ou reconstruir) uma versão à mão. A tag **não
#    precisa existir**: quando ela ainda não existe, o build sai do branch
#    padrão e o próprio tauri-action cria a tag no commit construído. Exigir a
#    tag antes já custou caro — a v0.2.0 foi publicada sem nenhum instalador
#    porque a tag existia e o workflow nunca rodou nela.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.2.0)"
        required: true
        type: string

# Required so tauri-action can create the GitHub Release with the built
# installers using the automatic GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  # Descobre de qual commit construir. Existe porque o `actions/checkout` precisa
  # de um ref que exista, e no disparo manual a tag pode ainda não ter sido
  # criada — é justamente o caso de "quero publicar esta versão agora".
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "::notice::Construindo a tag $TAG."
          else
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "::notice::A tag $TAG ainda não existe: construindo $DEFAULT_BRANCH, e o tauri-action criará a tag no commit construído."
          fi

  release:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            args: ""
          # Build the macOS app for x86_64 so we can bundle a reliable static
          # ffmpeg (evermeet). It runs on Apple Silicon via Rosetta 2.
          - os: macos-latest
            triple: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      SONARA_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # O commit da tag quando ela existe; o branch padrão quando ela ainda vai
      # ser criada. Nunca "o que estiver no default" por acidente.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      # Publicar a 0.5.1 a partir de um commit que diz 0.5.0 geraria
      # instaladores com a versão errada dentro. Melhor falhar aqui.
      - name: Conferir o que está sendo construído
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          echo "Tag:    $SONARA_TAG"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Versão em package.json: $PKG"
          if [ "${SONARA_TAG#v}" != "$PKG" ]; then
            echo "::error::A tag ($SONARA_TAG) não bate com a versão do código ($PKG). Atualize package.json, Cargo.toml, tauri.conf.json e src/version.ts antes de publicar."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install Linux dependencies (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install JS dependencies
        run: npm install

      # yt-dlp/ffmpeg are shipped as Tauri sidecars (see BUILD.md). Fetch static
      # builds for the target triple so the bundled app works on machines that
      # don't have them installed. Downloads are unverified upstream binaries.
      - name: Fetch yt-dlp + ffmpeg sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          TRIPLE="${{ matrix.triple }}"
          case "${{ matrix.os }}" in
            windows-latest)
              curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" \
                -o "src-tauri/binaries/yt-dlp-${TRIPLE}.exe"
              curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" \
                -o ffmpeg.zip
              7z x -y ffmpeg.zip >/dev/null
              cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe "src-tauri/binaries/ffmpeg-${TRIPLE}.exe"
              ;;
            macos-latest)
              curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
                -o "src-tauri/binaries/yt-dlp-${TRIPLE}"
              chmod +x "src-tauri/binaries/yt-dlp-${TRIPLE}"
              curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
              unzip -q -o ffmpeg.zip
              cp ffmpeg "src-tauri/binaries/ffmpeg-${TRIPLE}"
              chmod +x "src-tauri/binaries/ffmpeg-${TRIPLE}"
              ;;
            *)
              curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" \
                -o "src-tauri/binaries/yt-dlp-${TRIPLE}"
              chmod +x "src-tauri/binaries/yt-dlp-${TRIPLE}"
              curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
                -o ffmpeg.tar.xz
              tar xf ffmpeg.tar.xz
              cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "src-tauri/binaries/ffmpeg-${TRIPLE}"
              chmod +x "src-tauri/binaries/ffmpeg-${TRIPLE}"
              ;;
          esac
          ls -l src-tauri/binaries

      # Release notes live in CHANGELOG.md so every version documents itself
      # without this workflow being edited again. The heading format is
      # `## [x.y.z] — date`; the section runs until the next `## ` heading.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${SONARA_TAG#v}"
          BODY=""
          if [ -f CHANGELOG.md ]; then
            # Compare the first token of each heading literally, so version
            # numbers are never treated as regular expressions.
            BODY=$(awk -v v="$VERSION" '
              /^## / {
                if (found) exit
                line = $0
                sub(/^## +/, "", line)
                gsub(/[][]/, "", line)
                split(line, parts, / +/)
                if (parts[1] == v) found = 1
                next
              }
              found { print }
            ' CHANGELOG.md)
          fi
          if [ -z "$(printf %s "$BODY" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; using the generic body."
            BODY="Notas desta versão ainda não publicadas."
          fi
          {
            echo "body<<SONARA_NOTES_EOF"
            printf '%s\n' "$BODY"
            printf '%s\n' \
              "---" \
              "" \
              "## Baixar" \
              "" \
              "Escolha o arquivo do seu sistema abaixo, ou use a página de download:" \
              "**https://pedroa07.github.io/Sonara/**" \
              "" \
              "| Sistema | Arquivo |" \
              "|---|---|" \
              "| Windows | \`.exe\` (instalador) |" \
              "| macOS | \`.dmg\` |" \
              "| Linux | \`.AppImage\` ou \`.deb\` |" \
              "" \
              "O yt-dlp e o ffmpeg já vêm junto — não é preciso instalar mais nada." \
              "Se algum download falhar dentro do app, abra **Configurações → Diagnóstico**."
            echo "SONARA_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update artifacts (latest.json + .sig).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.SONARA_TAG }}
          releaseName: "Sonara ${{ env.SONARA_TAG }}"
          # Published, not draft: the download page and the in-app updater both
          # read `releases/latest/download/latest.json`, which 404s while the
          # release sits as a draft. Pre-releases are still marked as such.
          releaseDraft: false
          prerelease: ${{ contains(env.SONARA_TAG, '-') }}
          includeUpdaterJson: true
          releaseBody: ${{ steps.notes.outputs.body }}
          args: ${{ matrix.args }}
